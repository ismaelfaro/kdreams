apiVersion: kdream/v1
kind: Recipe
metadata:
  name: minimax-h3-gguf
  version: 1.0.0
  description: MiniMax H3 omni-modal video generation with native stereo audio, text/image-to-video via GGUF quantization (unet Q4_K_M + text encoder Q4_K_M). Peak memory ~24 GB with sequential component loading (text encoder unloaded before diffusion) — fits 32 GB Apple Silicon. Use Q5_K_M variants on 48 GB+ machines.
  tags: [video-generation, image-to-video, multimodal, diffusion, transformer, gguf, quantized, open-source]
  license: MiniMax H3 Community License Agreement
  author: kdream-community

source:
  repo: https://huggingface.co/MiniMaxAI/MiniMax-H3
  ref: main
  install_extras: [torch, llama-cpp-python, huggingface-hub]
  skip_package_install: true

models:
  - name: MiniMax-H3-FL2VA-Q4_K_M
    source: huggingface
    id: Abiray/MiniMax-H3-GGUF
    file_path: unet/MiniMax-H3-FL2VA-Q4_K_M.gguf
    component_role: unet
    destination: models/unet/MiniMax-H3-FL2VA-Q4_K_M.gguf

  - name: MiniMax-H3-Qwen3VL-TextEncoder-Q4_K_M
    source: huggingface
    id: Abiray/MiniMax-H3-GGUF
    file_path: text_encoders/qwen3vl_32b_minimax_h3-Q4_K_M.gguf
    component_role: text_encoder
    destination: models/text_encoders/qwen3vl_32b_minimax_h3-Q4_K_M.gguf

  - name: MiniMax-H3-VideoVAE-fp16
    source: huggingface
    id: Abiray/MiniMax-H3-GGUF
    file_path: vae/minimax_h3_video_vae_fp16.safetensors
    component_role: vae
    destination: models/vae/minimax_h3_video_vae_fp16.safetensors

  - name: MiniMax-H3-AudioVAE-fp32
    source: huggingface
    id: Abiray/MiniMax-H3-GGUF
    file_path: vae/minimax_h3_audio_vae_fp32.safetensors
    component_role: audio_vae
    destination: models/vae/minimax_h3_audio_vae_fp32.safetensors

entrypoint:
  script: run.py
  type: python
  generated_wrapper: true

inputs:
  prompt:
    type: string
    required: true
    description: Text description of the video to generate

  negative_prompt:
    type: string
    required: false
    default: ""
    description: What to exclude from the generated video

  first_frame_image:
    type: string
    required: false
    default: ""
    description: Path to the first frame image for image-to-video generation (optional; leave empty for text-to-video)

  last_frame_image:
    type: string
    required: false
    default: ""
    description: Path to the last frame image for first-and-last-frame generation (optional)

  duration:
    type: float
    required: false
    default: 5.0
    description: Output video duration in seconds (4–15 seconds)

  width:
    type: integer
    required: false
    default: 1280
    description: Output video width in pixels

  height:
    type: integer
    required: false
    default: 768
    description: Output video height in pixels

  steps:
    type: integer
    required: false
    default: 30
    description: Number of diffusion sampling steps

  guidance_scale:
    type: float
    required: false
    default: 6.0
    description: Classifier-free guidance scale controlling prompt adherence

  seed:
    type: integer
    required: false
    default: -1
    description: Random seed for reproducibility (-1 for random)

  workflow:
    type: string
    required: false
    default: minimax_fl2v_gguf_workflow.json
    description: ComfyUI workflow JSON file to use (minimax_fl2v_gguf_workflow.json for FL2VA, minimax_ref2va_gguf_workflow.json for Ref2VA)

  variant:
    type: string
    required: false
    default: MiniMax-H3-FL2VA-Q4_K_M.gguf
    description: Model variant filename to use (e.g. MiniMax-H3-FL2VA-Q4_K_M.gguf). Override to switch quantization level (e.g. Q3 variants for lower memory usage).

outputs:
  - name: result
    type: file
    path: outputs/{timestamp}.mp4

backends:
  local:
    requires_gpu: false
    min_vram_gb: 24
    tested_on: [mps, cuda, cpu]